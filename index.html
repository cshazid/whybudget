<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WHYBudget</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WHYBudget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1B45">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1B45">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy sticky header (file buttons, month, tabs), scrolling cards, navy pinned footer with the two leftover figures. */
:root{
  --navy:#0B1B45; --navy-2:#1D3270; --navy-text:#C9D3F0; --on-navy-good:#7CE3A8; --on-navy-bad:#FF8F9B;
  --accent:#2F5BEA; --accent-ink:#fff; --accent-line:#5B8CFF;
  --bg:#F3F5F9; --card:#fff; --line:#DCE1EC; --field:#F3F5F9;
  --text:#1B2440; --muted:#6B7490; --bad:#C62F3E; --good:#1B7F50; --warn-bg:#FFF4D6; --warn-text:#6B4E00;
  --overlay:rgba(8,14,34,.55);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --accent:#4F7DF3; --bg:#0C1222; --card:#151D33; --line:#26304D; --field:#0F1629;
  --text:#E7ECF8; --muted:#8E99B8; --bad:#FF8F9B; --good:#5FD39A; --warn-bg:#3A2F10; --warn-text:#F4D98A;
  --overlay:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#4F7DF3; --bg:#0C1222; --card:#151D33; --line:#26304D; --field:#0F1629;
  --text:#E7ECF8; --muted:#8E99B8; --bad:#FF8F9B; --good:#5FD39A; --warn-bg:#3A2F10; --warn-text:#F4D98A;
  --overlay:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
.brand{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:8px}
.brand img{width:30px;height:30px;border-radius:7px;display:block}
.brand b{font-size:17px;letter-spacing:.2px}
.spacer{flex:1}
.monthrow{display:flex;gap:8px;padding-bottom:10px;align-items:center}
.monthrow select{flex:1;min-width:0;background:#fff;color:var(--navy);border:0;border-radius:8px;padding:9px 10px;font-weight:600}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:#9FB0D9;padding:9px 14px 8px;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent-line)}

/* buttons */
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:#E6EAF4;color:var(--navy);white-space:nowrap}
.btn:active{filter:brightness(.92)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.navy{background:var(--navy-2);color:#fff}
.btn.white{background:#fff;color:var(--navy)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:none;color:var(--muted);padding:6px 8px}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{display:block;width:100%;text-align:center;padding:13px;white-space:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.primary):not(.navy):not(.white):not(.danger):not(.ghost){background:#22304F;color:#E7ECF8}
:root:not([data-theme="light"]) .btn.danger{color:#1a0a0d}}
:root[data-theme="dark"] .btn:not(.primary):not(.navy):not(.white):not(.danger):not(.ghost){background:#22304F;color:#E7ECF8}
.dotted{position:relative}
.dotted::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:#FFB84D;border:2px solid var(--navy)}

/* main */
main{padding-top:14px;padding-bottom:140px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.sec-head{display:flex;gap:10px;align-items:center}
.sec-head input{flex:1;min-width:0;font-size:17px;font-weight:700;color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;margin-left:-8px}
.sec-head input:focus{background:var(--field);border-color:var(--line);outline:none}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:99px;background:var(--field);color:var(--muted);border:1px solid var(--line)}
.item{padding:12px 0 4px;border-top:1px solid var(--line);margin-top:10px}
.item-top{display:flex;gap:8px;align-items:center}
.nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-top:8px;align-items:end}
.nums>*{min-width:0}
.extra{display:grid;gap:8px;margin-top:8px}
.extra.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.extra label{display:block;min-width:0}
.item input[type=date]{min-height:42px;-webkit-appearance:none;appearance:none}
.k{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.v{display:block;padding:9px 0;font-weight:600}
.v.neg{color:var(--bad)}
.link{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.link .v{padding-bottom:0}
.link small{display:block;color:var(--accent);font-size:12px;font-weight:600;padding-bottom:7px}
.field,.card input[type=text],.card input[type=date],.card input[type=number],.sheet input[type=text],.sheet input[type=date],.sheet select,.sheet textarea{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color:var(--text)}
.item input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;color:var(--text)}
input.bad{border-color:var(--bad)!important}
.sec-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.card.sec{overflow:hidden}
.paid{background:#1e9e5a;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;flex:none}.paid[hidden]{display:none}
.ext{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;user-select:text;-webkit-user-select:text}
.plan{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.prow{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prow.inc{background:#e8f5ec}.prow.drag{box-shadow:0 6px 18px rgba(0,0,0,.25);position:relative;z-index:2}
.prow .grip{width:44px;flex:none;border:0;background:none;font-size:20px;color:var(--muted);touch-action:none;cursor:grab}
.prow .pmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 6px 10px 0;display:flex;gap:8px;justify-content:space-between;color:var(--text)}
.prow .l{min-width:0}.prow .d{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow .m{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.prow .r,.prow .prem{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.prow .prem{padding:10px 12px 10px 4px;justify-content:center;min-width:92px}
.prow .k{font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.prow .v{font-weight:700}.prow .v.neg{color:#c0392b}
.part{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.duenote{font-size:12px;color:var(--muted);margin:3px 4px 0}
.totstrip{background:var(--navy);color:#fff;margin:14px -14px -14px;padding:10px 16px 11px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.totstrip>div:nth-child(2){text-align:center}.totstrip>div:nth-child(3){text-align:right}
.totstrip .tk{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--navy-text)}
.totstrip .tv{display:block;font-size:16px;font-weight:700;white-space:nowrap}
.totstrip .tv.neg{color:var(--on-navy-bad)}
.picker{position:relative}
.picker .plist{margin-top:6px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.picker .plist button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-size:15px;color:var(--text)}
.picker .plist button:last-child{border-bottom:0}.picker .plist button:active{background:var(--field)}
.picker .plist .none{padding:11px 12px;font-size:14px;color:var(--muted)}
.dbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 12px}
.dbox h4{margin:0 0 8px}
.dbox .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec-foot .tot{flex-basis:100%;font-size:13px;color:var(--muted)}
.sec-foot .tot b{color:var(--text)}
.x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:6px 8px;cursor:pointer;border-radius:8px}
.addrow{display:flex;gap:10px;margin-bottom:14px}.addrow .addbar{flex:1;width:auto;margin-bottom:0}.optbtn{padding:0 16px}
.actrow{display:flex;align-items:center;flex-wrap:nowrap;gap:6px}.actrow .v{white-space:nowrap}.actrow .v{padding:5px 0}
.iconbtn{background:transparent;border:1px solid transparent;opacity:.5;border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;padding:0;flex:none}
.iconbtn:active,.iconbtn:hover,.x.faint:active,.x.faint:hover{opacity:1;background:var(--field)}
.x.faint{opacity:.5;color:var(--accent)}
.ico{display:inline-flex}.ico svg{display:block}
.addbar{display:block;width:100%;border:2px dashed var(--line);background:none;color:var(--accent);border-radius:12px;padding:14px;font-weight:600;cursor:pointer;margin-bottom:14px}

/* transactions */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.summary{font-size:13px;color:var(--muted);margin:2px 0 12px}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.txn{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.txn.un{border-left:4px solid var(--accent)}
.txn .chk{display:flex;align-items:center;justify-content:center;width:46px;flex:none;cursor:pointer}
.txn .chk input{width:20px;height:20px;accent-color:var(--accent)}
.txn .main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:11px 12px 11px 0;cursor:pointer;display:flex;gap:10px;justify-content:space-between}
.txn .l{min-width:0}
.txn .d{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn.un .d{font-weight:700}
.txn .m{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn .a{font-weight:600;white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* welcome */
.welcome h1{font-size:24px;margin:6px 0 8px;line-height:1.2;text-wrap:balance}
.welcome p{color:var(--muted);margin:0 0 14px}
.welcome ol{margin:0 0 16px;padding-left:20px;color:var(--text)}
.welcome li{margin-bottom:6px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}

/* bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:10px;padding-bottom:10px}
.metrics small{display:block;font-size:10.5px;letter-spacing:.09em;color:var(--navy-text);font-weight:600}
.metrics b{font-size:21px;font-variant-numeric:tabular-nums}
.metrics b.pos{color:var(--on-navy-good)} .metrics b.neg{color:var(--on-navy-bad)}
.no-data .monthrow,.no-data .tabs{display:none}
.no-data .bottom>*{display:none}
.no-data .bottom{min-height:max(28px,env(safe-area-inset-bottom,0px))}
.no-data #main{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.no-data main{padding-bottom:40px}

/* sheets */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:86%}}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet h4{margin:20px 0 6px;font-size:15px;padding-top:14px;border-top:1px solid var(--line)}
.sheet label.f{display:block;margin-bottom:12px}
.sheet label.f>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.sheet .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.sheet .msg{color:var(--muted);margin:0 0 6px;white-space:pre-line}
.sheet .err{color:var(--bad);font-size:13px;margin:4px 0 0;min-height:1em}
.sheet .info{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);margin-bottom:12px}
.sheet .menu{display:grid;gap:8px}
.sheet textarea{height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.chkline{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.chkline input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px}
.check{fill:none;stroke:var(--on-navy-good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;flex:none}
.check path{stroke-dasharray:24;stroke-dashoffset:24}
.check.play{animation:checkFade 1.9s ease forwards}
.check.play path{animation:checkDraw .4s ease-out forwards}
@keyframes checkDraw{to{stroke-dashoffset:0}}
@keyframes checkFade{0%,72%{opacity:1}100%{opacity:0}}
html:has(#splash){background:#0B1B45}
#splash{position:fixed;left:0;right:0;top:0;bottom:calc(-1 * env(safe-area-inset-bottom,0px));min-height:100lvh;z-index:100;background:#0B1B45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:splashOut .45s ease 2.6s forwards}
#splash img{width:168px;height:168px;display:block;opacity:0;animation:fadeIn .9s ease .1s forwards}
#splash p{margin:0;color:#fff;font-weight:700;font-size:26px;letter-spacing:.2px;opacity:0;animation:fadeIn .6s ease 1s forwards}
@keyframes fadeIn{to{opacity:1}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation:splashOut .2s ease .5s forwards}#splash img,#splash p{animation:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--navy);color:#fff;border:1px solid var(--navy-2);padding:10px 14px;border-radius:10px;max-width:min(92vw,520px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.hidden-input{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.brand b{display:none}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>

<script>
"use strict";
/* ===== helpers ===== */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MAIN_KEY='main';
const DEFAULT_SECTIONS=[
  ['Monthly Income','income',['Paycheck / Salary','Other income']],
  ['Housing Costs','expense',['Rent / Mortgage','Utilities','Insurance','Property tax / HOA']],
  ['Debts (monthly payments)','expense',['Credit cards','Car loan','Student loans','Other debt']]];
const DRAFT_KEY='whybudget-last-copy';
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Math.random().toString(16).slice(2,10).padEnd(8,'0');
const round2=x=>Math.round((x+Number.EPSILON)*100)/100;
function money(x){return (x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function parseNum(s){const t=String(s??'').replace(/[$,\s]/g,'');if(t==='')return 0;return /^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)?Number(t):NaN;}
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='dataset')Object.assign(el.dataset,v);
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='checked'||k==='disabled'||k==='selected')el[k]=!!v;
    else if(v===true)el.setAttribute(k,'');
    else el.setAttribute(k,v);}
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(kid));}
  return el;}
function labelFor(k){if(k===MAIN_KEY)return 'Main Budget';const [y,m]=k.split('-');return MONTHS[+m-1]+' '+y;}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(iso){const [y,m,d]=iso.split('-');return `${m}/${d}/${y}`;}
const ICONS={search:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',pencil:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>'};
function icon(n){const e=document.createElement('span');e.className='ico';e.innerHTML=ICONS[n];return e;}
function clone(o){return JSON.parse(JSON.stringify(o));}
const dollarText=v=>{const t=String(v??'').trim();if(!t)return '';const n=parseNum(t);return isNaN(n)?String(v):money(n);};
const editText=v=>{const t=String(v??'').trim();if(!t)return '';const n=parseNum(t);return isNaN(n)?String(v):String(round2(n));};
const plainAmt=v=>{const t=String(v??'').trim();if(!t)return '';const n=parseNum(t);return isNaN(n)?String(v):n.toFixed(2);};
function rollDue(b,key){ // bring saved due dates (YYYY-MM-DD) into the month being copied to
  const [Y,M]=key.split('-').map(Number),last=new Date(Y,M,0).getDate();
  for(const s of b.sections)for(const r of s.rows)if(/^\d{4}-\d{2}-\d{2}$/.test(r.due||'')){
    const d=Math.min(+r.due.slice(8),last);r.due=Y+'-'+String(M).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  for(const parts of Object.values(b.plan_splits||{}))for(const q of parts)if(/^\d{4}-\d{2}-\d{2}$/.test(q.date||'')){
    const d=Math.min(+q.date.slice(8),last);q.date=Y+'-'+String(M).padStart(2,'0')+'-'+String(d).padStart(2,'0');}}

/* ===== state ===== */
let data=null, page='budget', filter='all', selected=new Set(), dirty=false, lastSaved=null;
const sortedKeys=()=>{const m=Object.keys(data.budgets).filter(k=>k!==MAIN_KEY).sort();return (MAIN_KEY in data.budgets?[MAIN_KEY]:[]).concat(m);};
const latestKey=()=>{const m=Object.keys(data.budgets).filter(k=>k!==MAIN_KEY).sort();return m.length?m[m.length-1]:null;};
const curBudget=()=>data.budgets[data.current];
const curSections=()=>curBudget().sections;
function defaultBudget(){return normalizeBudget({sections:DEFAULT_SECTIONS.map(([title,kind,names])=>({id:uid(),title,kind,rows:names.map(n=>({id:uid(),name:n,amount:''}))})),transactions:[]});}

function normalizeBudget(b){
  b=b||{};
  const raw=('sections' in b)?b.sections:b;
  let incoming;
  if(Array.isArray(raw))incoming=raw;
  else incoming=Object.entries(raw).filter(([k,v])=>Array.isArray(v)).map(([title,rows])=>({title,rows}));
  const sections=incoming.map(s=>({
    id:s.id||uid(), title:s.title||'Section',
    kind:s.kind||(s.title==='Monthly Income'?'income':'expense'),
    debt:s.debt??((s.kind||'expense')==='expense'&&/^debt/i.test(s.title||'')),
    rows:(s.rows||[]).map(r=>Array.isArray(r)?{id:uid(),name:r[0],amount:r[1]}:{...r,id:r.id||uid(),name:r.name||'',amount:r.amount??''})}));
  const has=k=>'sections' in b&&b[k];
  return {sections,transactions:('sections' in b&&Array.isArray(b.transactions))?b.transactions:[],
    deleted:Array.isArray(has('deleted'))?b.deleted:[],blocked:Array.isArray(has('blocked'))?b.blocked:[],
    plan_order:Array.isArray(has('plan_order'))?b.plan_order:[],
    plan_splits:(has('plan_splits')&&typeof b.plan_splits==='object'&&!Array.isArray(b.plan_splits))?b.plan_splits:{}};}

function loadData(obj){
  const d={budgets:{},untracked:Array.isArray(obj.untracked)?obj.untracked:[],current:obj.current};
  if(obj.budgets&&Object.keys(obj.budgets).length){
    for(const [k,v] of Object.entries(obj.budgets))d.budgets[k]=normalizeBudget(v);
    for(const b of Object.values(d.budgets)){ // older saves kept loose transactions inside a month
      const loose=b.transactions.filter(t=>t.item_id==null);
      if(loose.length){b.transactions=b.transactions.filter(t=>t.item_id!=null);d.untracked.push(...loose);}}
    if(MAIN_KEY in d.budgets&&!(todayKey() in d.budgets)){
      d.budgets[todayKey()]=d.budgets[MAIN_KEY];delete d.budgets[MAIN_KEY];
      if(d.current===MAIN_KEY)d.current=todayKey();}
  }else{
    throw new Error('This file has no budgets in it. Is it the budget_data.json from WHYBudget?');}
  data=d;
  if(!(data.current in data.budgets))data.current=sortedKeys()[0];
  page='budget';filter='all';selected=new Set();dirty=false;
}

/* ===== budget math ===== */
function shortChoices(key){ // item names without the section; the section is added only when two items share a name
  const rows=data.budgets[key].sections.flatMap(s=>s.rows.map(r=>({id:r.id,name:r.name||'(no name)',sec:s.title})));
  const count={};for(const r of rows){const k=r.name.trim().toLowerCase();count[k]=(count[k]||0)+1;}
  return rows.map(r=>({id:r.id,label:count[r.name.trim().toLowerCase()]===1?r.name:`${r.name} (${r.sec})`}));}
function itemChoices(key){return data.budgets[key].sections.flatMap(s=>s.rows.map(r=>({id:r.id,label:s.title+' - '+r.name})));}
function itemKind(key,id){for(const s of data.budgets[key].sections)for(const r of s.rows)if(r.id===id)return s.kind;return 'expense';}
function signedForItem(bank,mag,kind){const inn=bank>0;return kind==='income'?(inn?mag:-mag):(inn?-mag:mag);}
function actuals(){const a={},c={};for(const t of curBudget().transactions){a[t.item_id]=(a[t.item_id]||0)+t.amount;c[t.item_id]=(c[t.item_id]||0)+1;}return {a,c};}
function findTxn(id){for(const p of pools()){const t=p.find(x=>x.id===id);if(t)return t;}return null;}
function pools(){return [data.untracked,...Object.values(data.budgets).map(b=>b.transactions)];}
function removeTxn(t){data.untracked=data.untracked.filter(x=>x!==t);for(const b of Object.values(data.budgets))b.transactions=b.transactions.filter(x=>x!==t);}
function placeTxn(t,monthKey,itemId,magnitude){
  if('bank_amount' in t){const size=magnitude==null?Math.abs(t.amount):magnitude;t.amount=signedForItem(t.bank_amount,size,itemKind(monthKey,itemId));}
  t.item_id=itemId;removeTxn(t);data.budgets[monthKey].transactions.push(t);}

const sheets=[];
function openSheet(build,opts={}){
  return new Promise(resolve=>{
    const overlay=h('div',{class:'overlay'});
    const sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});
    overlay.append(sheet);document.body.append(overlay);
    const rec={overlay,sheet,live:!!opts.live,build,closed:false};
    rec.close=v=>{if(rec.closed)return;rec.closed=true;overlay.remove();sheets.splice(sheets.indexOf(rec),1);resolve(v);};
    rec.render=()=>{sheet.replaceChildren(build(rec.close));};
    overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)rec.close(undefined);});
    sheets.push(rec);rec.render();
    const first=$('input[type=text],input[type=date],select',sheet);if(first&&!opts.noFocus&&!('ontouchstart' in window))first.focus();});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheets.length)sheets[sheets.length-1].close(undefined);});
function refreshLive(){for(const s of sheets)if(s.live&&!s.closed)s.render();}

function updateComputed(){
  if(!data||page!=='budget'&&false)return;
  const {a,c}=actuals();
  let ib=0,sb=0,ia=0,sa=0,allOk=true;
  for(const sec of curSections()){
    const inc=sec.kind==='income';let bt=0,at=0,ok=true;
    const card=document.querySelector(`[data-sid="${sec.id}"]`);
    for(const r of sec.rows){
      const act=a[r.id]||0;at+=act;
      const row=card&&card.querySelector(`[data-rid="${r.id}"]`);
      const b=parseNum(r.amount);
      if(row){
        $('[data-f=bud]',row).classList.toggle('bad',isNaN(b));
        $('[data-o=paid]',row).hidden=!(!inc&&!isNaN(b)&&b!==0&&round2(b-act)===0);}
      if(isNaN(b)){ok=false;if(row){const e=$('[data-o=rem]',row);e.textContent='--';e.classList.remove('neg');}}
      else{bt+=b;if(row){const e=$('[data-o=rem]',row);e.textContent=money(round2(b-act));e.classList.toggle('neg',!inc&&b-act<0);}}}
    if(inc)ia+=at;else sa+=at;
    if(ok){if(inc)ib+=bt;else sb+=bt;}else allOk=false;
    if(card){
      $('[data-o=tb]',card).textContent=ok?money(round2(bt)):'--';
      $('[data-o=ta]',card).textContent=money(round2(at));
      const tr=$('[data-o=tr]',card);tr.textContent=ok?money(round2(bt-at)):'--';
      tr.classList.toggle('neg',ok&&!inc&&bt-at<0);}}
  const mb=$('#mBud'),ma=$('#mAct');
  if(allOk){const left=round2(ib-sb);mb.textContent=money(left);mb.className='num '+(left>=0?'pos':'neg');}else{mb.textContent='--';mb.className='num';}
  const al=round2(ia-sa);ma.textContent=money(al);ma.className='num '+(al>=0?'pos':'neg');}

/* ----- planning page: plan each paycheck against the bills, drag to reorder, split payments ----- */
const curSplits=()=>curBudget().plan_splits||(curBudget().plan_splits={});
const curOrder=()=>curBudget().plan_order||(curBudget().plan_order=[]);
function planItems(){
  const out=[],splits=curSplits();
  for(const sec of curSections())for(const r of sec.rows){
    const type=sec.kind==='income'?'Income':sec.debt?'Debt':'Expense';
    const iso=validDue(r.due)?r.due:'',name=(r.name||'').trim()||'(no name)',parts=splits[r.id];
    if(parts&&parts.length)parts.forEach((q,n)=>{const v=parseNum(q.amount);out.push({id:r.id+'#'+n,base:r.id,name:`${name} (${n+1} of ${parts.length})`,type,date:validDue(q.date)?q.date:iso,amount:isNaN(v)?0:v});});
    else{const v=parseNum(r.amount);out.push({id:r.id,base:r.id,name,type,date:iso,amount:isNaN(v)?0:v});}}
  return out;}
function defaultPlanOrder(items){ // income with no pay date first, then by date (pay before bills on the same day)
  const key=(it,i)=>(it.type==='Income'&&!it.date)?[0,'',0,i]:[1,it.date||'9999-99-99',it.type==='Income'?0:1,i];
  return items.map((it,i)=>[key(it,i),it]).sort((a,b)=>{for(let k=0;k<4;k++){if(a[0][k]<b[0][k])return -1;if(a[0][k]>b[0][k])return 1;}return 0;}).map(x=>x[1]);}
function orderedPlan(){
  const items=planItems(),ordered=defaultPlanOrder(items),saved=curOrder();
  if(!saved.length)return ordered;
  const byId=Object.fromEntries(items.map(it=>[it.id,it]));
  const result=saved.filter(i=>i in byId).map(i=>byId[i]),placed=new Set(result.map(x=>x.id));
  for(const it of ordered){if(placed.has(it.id))continue;
    if(it.type==='Income'&&!it.date)result.unshift(it);
    else{const at=result.findIndex(o=>o.date&&it.date&&o.date>it.date);result.splice(at<0?result.length:at,0,it);}
    placed.add(it.id);}
  return result;}
function planningView(){
  const frag=h('div');
  frag.append(h('p',{class:'msg'},'Drag the ☰ handle to move items up or down. Income adds to Remaining and everything after it subtracts, so you can see what each paycheck covers. Tap an item to split it into parts paid on different dates.'));
  const list=h('div',{class:'plan'});
  const info={};
  for(const it of orderedPlan()){info[it.id]=it;
    list.append(h('div',{class:'prow'+(it.type==='Income'?' inc':''),dataset:{pid:it.id}},
      h('button',{class:'grip','aria-label':'Drag to move '+it.name},'☰'),
      h('button',{class:'pmain',dataset:{act:'split',base:it.base}},
        h('span',{class:'l'},h('span',{class:'d'},it.name),h('span',{class:'m'},it.type+(it.date?'  ·  '+fmtDate(it.date):''))),
        h('span',{class:'r'},h('span',{class:'k'},it.type==='Income'?'Income':'Budgeted'),h('span',{class:'num'},(it.type==='Income'?'+':'')+money(it.amount)))),
      h('span',{class:'prem'},h('span',{class:'k'},'Remaining'),h('span',{class:'v num',dataset:{o:'prem'}},''))));}
  frag.append(list);
  const summary=h('div',{class:'summary num',dataset:{o:'psum'}});frag.append(summary);
  const recompute=()=>{let bal=0;
    for(const row of list.children){const it=info[row.dataset.pid];bal+=it.type==='Income'?it.amount:-it.amount;
      const e=$('[data-o=prem]',row);e.textContent=money(round2(bal));e.classList.toggle('neg',round2(bal)<0);}
    summary.textContent='Ends with '+money(round2(bal))+' after everything in the list'+(round2(bal)<0?'  (you are short)':'');};
  recompute();
  let drag=null,timer=null;
  const place=()=>{const others=[...list.children].filter(r=>r!==drag.row);let before=null;
    for(const r of others){const b=r.getBoundingClientRect();if(drag.y<b.top+b.height/2){before=r;break;}}
    if(drag.row.nextSibling!==before)list.insertBefore(drag.row,before);recompute();};
  list.addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;
    e.preventDefault();const row=g.closest('.prow');g.setPointerCapture(e.pointerId);
    drag={row,y:e.clientY,id:e.pointerId};row.classList.add('drag');
    timer=setInterval(()=>{if(!drag)return; // slowly scroll the page while a row is held near the top or bottom
      if(drag.y<110)window.scrollBy(0,-7);else if(drag.y>innerHeight-110)window.scrollBy(0,7);else return;place();},35);});
  list.addEventListener('pointermove',e=>{if(!drag)return;drag.y=e.clientY;place();});
  const end=()=>{if(!drag)return;clearInterval(timer);drag.row.classList.remove('drag');drag=null;
    curOrder().splice(0,curOrder().length,...[...list.children].map(r=>r.dataset.pid));markDirty();};
  list.addEventListener('pointerup',end);list.addEventListener('pointercancel',end);
  return frag;}
function planText(rid){
  const parts=curSplits()[rid];
  if(parts&&parts.length)return 'Split into '+parts.length+' payments:  '+parts.map(q=>money(parseNum(q.amount))+(validDue(q.date)?' on '+fmtDate(q.date):' (no date)')).join(';  ');
  const f=findRowById(rid);return 'One payment'+(f&&validDue(f.row.due)?' on '+fmtDate(f.row.due):'')+'.';}
function findRowById(rid){for(const s of curSections()){const row=s.rows.find(r=>r.id===rid);if(row)return {sec:s,row};}return null;}
function putInOrder(base,parts){
  const order=curOrder(),old=order.filter(i=>i===base||i.startsWith(base+'#'));if(!old.length)return;
  const at=order.indexOf(old[0]),rest=order.filter(i=>!old.includes(i));
  const ids=parts.length?parts.map((_,n)=>base+'#'+n):[base];
  if(!parts.length)rest.splice(at,0,...ids);
  else{const dates={};for(const it of planItems())dates[it.id]=it.date;
    const idx=ids.map((_,n)=>n).sort((a,b)=>{const x=parts[a].date||'9999',y=parts[b].date||'9999';return x<y?-1:x>y?1:a-b;});
    for(const n of idx){const when=parts[n].date;let spot;
      if(when){spot=rest.findIndex(o=>dates[o]&&dates[o]>when);if(spot<0)spot=rest.length;}else spot=Math.min(at,rest.length);
      rest.splice(spot,0,ids[n]);}}
  order.splice(0,order.length,...rest);}
function splitSheet(base){
  const f=findRowById(base);if(!f)return;
  const budget=(()=>{const v=parseNum(f.row.amount);return isNaN(v)?0:v;})(),own=validDue(f.row.due)?f.row.due:'';
  const existing=curSplits()[base];
  let entries=existing?existing.map(q=>({amount:q.amount||'',date:validDue(q.date)?q.date:''})):
    (()=>{const a=round2(budget/2);return [{amount:budget?a.toFixed(2):'',date:own},{amount:budget?round2(budget-a).toFixed(2):'',date:''}];})();
  openSheet(close=>{
    const box=h('div'),sum=h('p',{class:'msg num'}),err=h('p',{class:'err',role:'alert'});
    const upd=()=>{const tot=round2(entries.reduce((n,e)=>n+(parseNum(e.amount)||0),0)),left=round2(budget-tot);
      sum.textContent=left===0?'Parts add up to '+money(tot):left>0?`Parts add up to ${money(tot)}  -  ${money(left)} still to assign`:`Parts add up to ${money(tot)}  -  ${money(-left)} over the budget`;
      sum.style.color=left===0?'#1e9e5a':'var(--bad,#c0392b)';};
    const draw=()=>{box.replaceChildren(...entries.map((e,n)=>{
      const a=h('input',{type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'0.00','aria-label':'Part '+(n+1)+' amount'});a.value=e.amount;
      const d=h('input',{type:'date','aria-label':'Part '+(n+1)+' date'});d.value=e.date;
      a.addEventListener('input',()=>{e.amount=a.value;upd();});d.addEventListener('change',()=>{e.date=d.value;});
      return h('div',{class:'part'},h('span',{class:'k'},'Part '+(n+1)),a,d,
        entries.length>1?h('button',{type:'button',class:'x','aria-label':'Remove part',onclick:()=>{entries.splice(n,1);draw();}},'×'):h('span'));}));upd();};
    draw();
    const save=async()=>{
      const parts=[];
      for(const e of entries){const v=parseNum(e.amount);
        if(isNaN(v)){err.textContent='Please enter each amount as a number, like 250.00.';return;}
        if(round2(v)<=0){err.textContent='Every part needs an amount above zero. Use the × to remove a part you do not need.';return;}
        parts.push({amount:round2(v).toFixed(2),date:e.date||''});}
      const total=round2(parts.reduce((n,q)=>n+parseFloat(q.amount),0));
      if(round2(total-budget)!==0&&!await confirmSheet("Parts don't match the budget",`The parts add up to ${money(total)} but the budget is ${money(budget)}.\n\nSave anyway?`,'Save anyway'))return;
      curSplits()[base]=parts;putInOrder(base,parts);close(true);markDirty();render();};
    return h('div',null,h('h3',null,(f.row.name||'(no name)')),h('p',{class:'msg'},`Budgeted ${money(budget)}.  Enter each part and the date it will be paid.`),
      box,sum,err,
      h('div',{class:'row'},h('button',{class:'btn',onclick:()=>{const left=round2(budget-entries.reduce((n,e)=>n+(parseNum(e.amount)||0),0));entries.push({amount:left>0?left.toFixed(2):'',date:''});draw();}},'+ Add part'),
        existing?h('button',{class:'btn',onclick:()=>{putInOrder(base,[]);delete curSplits()[base];close(true);markDirty();render();}},'Pay in one go'):null),
      h('div',{class:'row'},h('button',{class:'btn',onclick:()=>close(undefined)},'Cancel'),h('span',{class:'spacer'}),h('button',{class:'btn primary',onclick:save},'Save')));});}

/* a text box that doubles as a drop-down: typing narrows the list of budget items */
function itemPicker(monthEl,{initial=null,required=false,startWithFirst=false}={}){
  const input=h('input',{type:'text',autocomplete:'off','aria-label':'Budget item',placeholder:required?'Type to search items':'Type to search, or leave empty'});
  const list=h('div',{class:'plist'});list.hidden=true;
  let chosen=null;
  const show=()=>{
    const q=input.value.trim().toLowerCase();
    const ch=shortChoices(monthEl.value).filter(c=>c.label.toLowerCase().includes(q));
    list.replaceChildren(...(ch.length?ch.map(c=>h('button',{type:'button',onclick:()=>{chosen=c.id;input.value=c.label;list.hidden=true;}},c.label)):[h('div',{class:'none'},'No items match')]));
    list.hidden=false;};
  const setItem=id=>{const c=shortChoices(monthEl.value).find(x=>x.id===id);chosen=c?c.id:null;input.value=c?c.label:'';list.hidden=true;};
  input.addEventListener('input',()=>{chosen=null;show();});
  input.addEventListener('focus',show);
  monthEl.addEventListener('change',()=>{chosen=null;input.value='';list.hidden=true;});
  const first=shortChoices(monthEl.value)[0];
  setItem(initial||(startWithFirst&&first?first.id:null));
  const value=()=>{ // an item id, null when empty, undefined when it matches nothing
    const t=input.value.trim().toLowerCase();
    if(chosen&&shortChoices(monthEl.value).some(c=>c.id===chosen&&c.label.toLowerCase()===t))return chosen;
    if(!t)return null;
    const all=shortChoices(monthEl.value),exact=all.filter(c=>c.label.toLowerCase()===t);
    if(exact.length)return exact[0].id;
    const part=all.filter(c=>c.label.toLowerCase().includes(t));
    return part.length===1?part[0].id:undefined;};
  return {el:h('div',{class:'picker'},input,list),value};}

  return isoDate(now);}

async function addTxn(presetItem=null){
  const res=await txnDialog({presetItem});if(!res||res.remove)return;
  const t={id:uid(),date:res.date,description:res.description,amount:res.amount,item_id:res.item_id};
  if(res.item_id==null)data.untracked.push(t); // no budget item chosen: stays unallocated

  markDirty();render();}
function unallocateTxn(t){
  if('bank_amount' in t)t.amount=t.bank_amount;
  t.item_id=null;removeTxn(t);data.untracked.push(t);}
async function editTxn(id){
  const t=findTxn(id);if(!t)return;

  if(res.remove){
    if(!await confirmSheet('Delete transaction','Delete this transaction?\n\nIt will stay in Recently deleted so you can restore it.','Delete',true))return;

  t.date=res.date;t.description=res.description;
  if(res.item_id==null){if(!('bank_amount' in t))t.amount=res.amount;unallocateTxn(t);markDirty();render();return;}
  if('bank_amount' in t)placeTxn(t,res.month,res.item_id,Math.abs(res.amount));
  else{t.amount=res.amount;placeTxn(t,res.month,res.item_id);}
  tellIfElsewhere(res.month,1);markDirty();render();}
/* Recently deleted: per month. A fingerprint list keeps deleted imports from coming back with a new CSV. */
const curDeleted=()=>curBudget().deleted||(curBudget().deleted=[]);
const curBlocked=()=>curBudget().blocked||(curBudget().blocked=[]);
const fingerprint=t=>{const amt=round2('bank_amount' in t?t.bank_amount:t.amount);return t.source_id?{sid:t.source_id,amount:amt}:{date:t.date,amount:amt,description:t.description};};
function trashTxns(list){
  for(const t of list){
    removeTxn(t);t.deleted_from=t.item_id;t.deleted_at=new Date().toISOString();curDeleted().push(t);
    if('bank_amount' in t||t.source_id)curBlocked().push(fingerprint(t));}}
function restoreDeleted(id){
  const list=curDeleted(),i=list.findIndex(t=>t.id===id);if(i<0)return;
  const t=list.splice(i,1)[0];const old=t.deleted_from;delete t.deleted_from;delete t.deleted_at;
  if('bank_amount' in t||t.source_id){const key=JSON.stringify(fingerprint(t));const b=curBlocked(),j=b.findIndex(m=>JSON.stringify(m)===key);if(j>=0)b.splice(j,1);}
  if(old&&itemKind(data.current,old)&&curSections().some(s=>s.rows.some(r=>r.id===old))){t.item_id=old;curBudget().transactions.push(t);}
  else{if('bank_amount' in t)t.amount=t.bank_amount;t.item_id=null;data.untracked.push(t);}}

      h('div',{class:'row'},
        list.length?h('button',{class:'btn danger',onclick:async()=>{
          if(await confirmSheet('Empty recently deleted',`Permanently remove ${list.length} transaction(s)?\n\nThis can't be undone. A new CSV still won't add them back.`,'Empty',true)){curDeleted().length=0;markDirty();render();}}},'Empty'):null,
        h('span',{class:'spacer'}),h('button',{class:'btn',onclick:()=>close()},'Close')));},{live:true,noFocus:true});}

  if(res.copy){const nb=clone(data.budgets[source]);nb.transactions=[];nb.deleted=[];nb.blocked=[];rollDue(nb,res.key);data.budgets[res.key]=nb;}else data.budgets[res.key]=defaultBudget();
  data.current=res.key;selected=new Set();markDirty();render();}

async function resetMonth(){
  const keys=sortedKeys(),i=keys.indexOf(data.current);
  if(i<=0){await infoSheet('Nothing to copy from','There is no earlier budget to copy from.');return;}
  const prev=keys[i-1],n=curBudget().transactions.length;
  const ok=await confirmSheet('Reset budget',`Reset ${labelFor(data.current)} using ${labelFor(prev)}?\n\nAll sections, items and amounts in ${labelFor(data.current)} will be replaced with ${labelFor(prev)}'s.`+(n?`\n\nIts ${n} transaction(s) will also be deleted.`:'')+`\n\nThis can't be undone.`,'Reset',true);
  if(!ok)return;
  const fresh=clone(data.budgets[prev]);fresh.transactions=[];fresh.deleted=curBudget().deleted||[];fresh.blocked=curBudget().blocked||[];rollDue(fresh,data.current);data.budgets[data.current]=fresh;markDirty();render();}
async function deleteMonth(){
  if(Object.keys(data.budgets).length<=1){await infoSheet("Can't delete",'You need at least one budget. Create another month first, then delete this one.');return;}
  const n=curBudget().transactions.length;
  const ok=await confirmSheet('Delete budget',`Delete the ${labelFor(data.current)} budget?`+(n?`\n\nThis also deletes its ${n} transaction(s).`:'')+`\n\nThis can't be undone.`,'Delete',true);
  if(!ok)return;
  const keys=sortedKeys(),i=keys.indexOf(data.current),go=i>0?keys[i-1]:keys[i+1];
  delete data.budgets[data.current];data.current=go;selected=new Set();markDirty();render();}
function optionsSheet(){
  const keys=sortedKeys(),i=keys.indexOf(data.current);
  openSheet(close=>h('div',null,h('h3',null,labelFor(data.current)),
    h('div',{class:'menu'},
      h('button',{class:'btn block',disabled:i<=0,onclick:()=>{close();resetMonth();}},i>0?`Reset using ${labelFor(keys[i-1])}...`:'Reset using previous month...'),
      h('button',{class:'btn block',disabled:keys.length<=1,onclick:()=>{close();deleteMonth();}},`Delete ${labelFor(data.current)}...`),
      h('button',{class:'btn block',onclick:()=>close()},'Close'))),{noFocus:true});}

/* ===== bank CSV ===== */
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));}
function parseCsvDate(s){
  s=s.trim();let m,y,d;
  if(m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s)){y=+m[3];d=+m[2];m=+m[1];}
  else if(m=/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/.exec(s)){y=+m[3];y+=y>=69?1900:2000;d=+m[2];m=+m[1];}
  else if(m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s)){y=+m[1];d=+m[3];m=+m[2];}
  else return null;
  const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function parseBankCsv(rows){
  const head=rows[0].map(x=>x.trim().toLowerCase());const idx=n=>head.indexOf(n);
  if(idx('amount')<0||(idx('posting date')<0&&idx('effective date')<0))
    throw new Error("This doesn't look like a bank transactions file.\n\nI need columns named 'Posting Date' and 'Amount' (plus 'Description' and 'Transaction ID' if you have them).");
  const col=(r,n)=>{const i=idx(n);return i<0?'':(r[i]||'').trim();};
  const parsed=[];let pending=0,bad=0;
  for(const r of rows.slice(1)){
    const status=col(r,'posting status');if(status&&status.toLowerCase()!=='posted'){pending++;continue;}
    const when=parseCsvDate(col(r,'posting date')||col(r,'effective date'));const amount=round2(parseNum(col(r,'amount')));
    if(!when||isNaN(amount)){bad++;continue;}
    if(amount===0)continue;
    parsed.push({date:when,amount,description:col(r,'description')||col(r,'extended description')||'(no description)',
      category:col(r,'transaction category'),extended:col(r,'extended description')||col(r,'extended details'),source_id:col(r,'transaction id')||col(r,'reference number')});}
  return {parsed,pending,bad};}
function importTransactions(parsed){
  const pairs=new Set(),ids=new Set(),prints=new Set(),byPair={},byPrint={};
  for(const pool of pools())for(const t of pool){
    const sid=t.source_id,bank=round2('bank_amount' in t?t.bank_amount:t.amount);
    if(sid){pairs.add(sid+'|'+bank);ids.add(sid);byPair[sid+'|'+bank]=t;}
    else if('bank_amount' in t){const fp=[t.date,bank,t.description].join('|');prints.add(fp);byPrint[fp]=t;}}
  const blockedPairs=new Set(),blockedPrints=new Set(); // ones you deleted: never added again
  for(const b of Object.values(data.budgets))for(const m of (b.blocked||[])){
    if('sid' in m)blockedPairs.add(m.sid+'|'+round2(m.amount));else blockedPrints.add([m.date,round2(m.amount),m.description].join('|'));}
  let added=0,dupes=0,changed=0,blocked=0,filled=0;
  for(const p of parsed){
    const sid=p.source_id,amount=round2(p.amount);
    const fpKey=[p.date,amount,p.description].join('|');
    if((sid&&blockedPairs.has(sid+'|'+amount))||(!sid&&blockedPrints.has(fpKey))){blocked++;continue;}
    if(sid){
      if(pairs.has(sid+'|'+amount)){dupes++;const old=byPair[sid+'|'+amount];if(old&&p.extended&&!old.extended){old.extended=p.extended;filled++;}continue;}
      if(ids.has(sid))changed++;
      pairs.add(sid+'|'+amount);ids.add(sid);}
    else{if(prints.has(fpKey)){dupes++;const old=byPrint[fpKey];if(old&&p.extended&&!old.extended){old.extended=p.extended;filled++;}continue;}prints.add(fpKey);}
    data.untracked.push({id:uid(),date:p.date,description:p.description,amount,bank_amount:amount,item_id:null,category:p.category,extended:p.extended||'',source_id:sid});added++;}
  return {added,dupes,changed,blocked,filled};}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(r.error);r.readAsText(file);});}

async function onCsvChosen(file){
  try{
    const rows=parseCSV(await readFile(file));
    if(!rows.length)throw new Error('That file is empty.');
    const {parsed,pending,bad}=parseBankCsv(rows);
    const r=importTransactions(parsed);
    const lines=[];
    if(r.added)lines.push(`Added ${r.added} new transaction(s) as Untracked.\nThey show in every month until you allocate them. Select them and tap Allocate to pick a budget month and item.`);
    else lines.push('No new transactions were added.');
    if(r.dupes)lines.push(`Skipped ${r.dupes} duplicate(s): same Transaction ID and amount as one already imported.`);
    if(r.changed)lines.push(`${r.changed} had a Transaction ID that was already imported but a different amount, so they were added as new. Compare them with the earlier ones.`);
    if(r.filled)lines.push(`Added the Extended Description to ${r.filled} transaction(s) imported earlier.`);
    else if(!parsed.some(p=>p.extended))lines.push("This file has no Extended Description column (or it's empty), so none could be added to earlier transactions.");
    if(r.blocked)lines.push(`Skipped ${r.blocked} you deleted earlier (see Recently deleted).`);
    if(pending)lines.push(`Skipped ${pending} that aren't posted yet.`);
    if(bad)lines.push(`Skipped ${bad} row(s) with a date or amount I couldn't read.`);
    if(r.added||r.filled)markDirty();
    page='transactions';render();
    await infoSheet('Upload finished',lines.join('\n\n'));
  }catch(e){await infoSheet("Couldn't read the file",e.message||String(e));}}

/* ===== opening and saving the file ===== */
function openFilePicker(){$('#jsonPick').value='';$('#jsonPick').click();}
async function onJsonChosen(file){
  if(dirty&&!await confirmSheet('Unsaved changes','You have changes that are not saved to your file. Opening another file replaces them.','Open anyway',true))return;
  try{
    const obj=JSON.parse((await readFile(file)).replace(/^﻿/,''));
    loadData(obj);persistLast();render();window.scrollTo(0,0);toast('Opened '+file.name);
  }catch(e){await infoSheet("Couldn't open that file",(e instanceof SyntaxError?'That file is not valid JSON. Make sure you chose budget_data.json.':e.message));}}
function startNew(){const k=todayKey();data={budgets:{[k]:defaultBudget()},untracked:[],current:k};page='budget';markDirty();render();}
function resumeDraft(d){try{loadData(d.data);dirty=true;render();toast('Continuing your unsaved work');}catch(e){infoSheet("Couldn't resume",e.message);}}

function fileText(){return JSON.stringify({budgets:data.budgets,untracked:data.untracked,current:data.current},null,2);}
async function saveFile(){
  if(!data)return;
  const text=fileText();
  const file=new File([text],'budget_data.json',{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
    }else{
      const url=URL.createObjectURL(file);
      const a=h('a',{href:url,download:'budget_data.json'});document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);}
    markSaved();
  }catch(e){
    if(e&&e.name==='AbortError')return;
    showCopyFallback(text);}}
function showCopyFallback(text){
  openSheet(close=>{
    const ta=h('textarea',{readonly:true,'aria-label':'Budget file contents'});ta.value=text;
    return h('div',null,h('h3',null,'Saving is not available here'),
      h('p',{class:'msg'},"This view can't hand a file to your phone. Copy the text below into a file named budget_data.json instead, or try again in Safari."),
      ta,h('div',{class:'row'},h('button',{class:'btn',onclick:()=>close()},'Close'),
        h('button',{class:'btn primary',onclick:async()=>{try{await navigator.clipboard.writeText(text);toast('Copied');}catch(e){ta.select();toast('Select all and copy');}}},'Copy')));},{noFocus:true});}

/* ===== events ===== */
$('#btnOpen').onclick=openFilePicker;
$('#btnSave').onclick=saveFile;
$('#btnNew').onclick=()=>{if(data)newMonth();};
$('#jsonPick').addEventListener('change',e=>{const f=e.target.files[0];if(f)onJsonChosen(f);});
$('#csvPick').addEventListener('change',e=>{const f=e.target.files[0];if(f)onCsvChosen(f);});
$('#monthSel').addEventListener('change',e=>{data.current=e.target.value;selected=new Set();persistLast();render();window.scrollTo(0,0);});
for(const t of document.querySelectorAll('.tab'))t.addEventListener('click',()=>{
  if(!data||t.dataset.tab===page)return;
  const order=['budget','transactions','planning'];const dir=order.indexOf(t.dataset.tab)>order.indexOf(page)?1:-1;page=t.dataset.tab;render();window.scrollTo(0,0);
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&main.animate)
    main.animate([{transform:`translateX(${dir*40}px)`,opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.7,.2,1)'});});

const ROW_EXTRA=['due','balance','min_payment','rate'];
const main=$('#main');
main.addEventListener('input',e=>{
  const t=e.target,f=t.dataset.f;if(!f||f==='sel')return;
  const card=t.closest('[data-sid]');if(!card)return;
  if(f==='title'){const s=curSections().find(x=>x.id===card.dataset.sid);if(s){s.title=t.value;markDirty();}return;}
  const loc=findRow(card.dataset.sid,t.closest('[data-rid]').dataset.rid);if(!loc||!loc.row)return;
  if(f==='name')loc.row.name=t.value;else if(f==='bud')loc.row.amount=plainAmt(t.value);else if(ROW_EXTRA.includes(f))loc.row[f]=t.value;
  markDirty();});
main.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.f==='bud')t.value=editText(t.value);});
main.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.f==='bud')t.value=dollarText(t.value);});
main.addEventListener('change',e=>{
  const t=e.target,f=t.dataset.f;
  if(f==='bud'||ROW_EXTRA.includes(f))updateComputed();
  if(f==='sel'){const id=t.closest('[data-tid]').dataset.tid;if(t.checked)selected.add(id);else selected.delete(id);renderMain();}});
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,card=b.closest('[data-sid]'),row=b.closest('[data-rid]'),tx=b.closest('[data-tid]');
  switch(act){
    case 'add-section':addSection();break;
    case 'options':optionsSheet();break;
    case 'rename-section':{const el=card.querySelector('[data-f=title]');el.focus();el.select();break;}
    case 'del-section':deleteSection(card.dataset.sid);break;
    case 'add-item':{const s=curSections().find(x=>x.id===card.dataset.sid);const r={id:uid(),name:'New item',amount:'',due:''};if(s.debt)Object.assign(r,{balance:'',min_payment:'',rate:''});s.rows.push(r);markDirty();render();
      const el=document.querySelector(`[data-rid="${r.id}"] [data-f=name]`);if(el){el.focus();el.select();}break;}
    case 'del-item':deleteItem(card.dataset.sid,row.dataset.rid);break;
    case 'view-item':itemSheet(row.dataset.rid);break;
    case 'split':splitSheet(b.dataset.base);break;
    case 'upload':$('#csvPick').value='';$('#csvPick').click();break;
    case 'add-txn':addTxn();break;
    case 'recent':recentlyDeletedSheet();break;
    case 'filter':filter=b.dataset.v;renderMain();break;
    case 'edit-txn':editTxn(tx.dataset.tid);break;
    case 'allocate':allocateSelected();break;
    case 'delete-selected':deleteSelected();break;
    case 'clear-sel':selected=new Set();renderMain();break;
    case 'select-untracked':selected=new Set(visibleTxns().filter(t=>t.item_id==null).map(t=>t.id));renderMain();break;}});

render();

/* opening screen: logo fades in, then the words, then it fades out by itself. Tap to skip. */
(function(){
  const sp=document.getElementById('splash');if(!sp)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let gone=false;
  const end=()=>{if(gone)return;gone=true;sp.style.animation='splashOut .25s ease forwards';setTimeout(()=>sp.remove(),300);};
  sp.addEventListener('pointerdown',end);
  setTimeout(()=>{if(!gone){gone=true;sp.remove();}},reduce?900:3200);
})();
</script>
